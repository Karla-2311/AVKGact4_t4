spring.application.name=act4-api
server.port=${PORT:8088}

# Base de datos (en el VPS se sobreescribe con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/act4_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:act3_user}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (el secreto debe tener al menos 32 caracteres; cambialo en el VPS con JWT_SECRET)
jwt.secret=${JWT_SECRET:karla-guadalupe-antonio-vazquez-23}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
